@if (options(); as opts) {
  <div class="dialog-backdrop">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3>{{ opts.title }}</h3>
      <p>{{ opts.message }}</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ opts.cancelText ?? ('common.cancel' | translate) }}</button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="opts.danger"
          [class.btn-primary]="!opts.danger"
          (click)="confirm()"
        >
          {{ opts.confirmText ?? ('common.confirm' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
