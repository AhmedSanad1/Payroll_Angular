<div class="card-header">
  <h2>{{ 'reports.employeesTitle' | translate }}</h2>
  <div class="toolbar">
    <button type="button" class="btn btn-secondary" (click)="print()">{{ 'common.print' | translate }}</button>
    <button type="button" class="btn btn-primary" [disabled]="exportingPdf()" (click)="exportPdf()">
      {{ (exportingPdf() ? 'common.exportingPdf' : 'common.exportPdf') | translate }}
    </button>
  </div>
</div>

<div class="card">
  <div class="toolbar" style="margin-bottom: 1rem;">
    <select [(ngModel)]="departmentId" (ngModelChange)="load()">
      <option [ngValue]="null">{{ 'common.allDepartments' | translate }}</option>
      @for (d of departments(); track d.id) {
        <option [ngValue]="d.id">{{ d.name }}</option>
      }
    </select>
    <select [(ngModel)]="jobGradeId" (ngModelChange)="load()">
      <option [ngValue]="null">{{ 'common.allGrades' | translate }}</option>
      @for (g of jobGrades(); track g.id) {
        <option [ngValue]="g.id">{{ g.nameEn }}</option>
      }
    </select>
  </div>

  @if (loading()) {
    <div class="loading-row">{{ 'common.loading' | translate }}</div>
  } @else if (rows().length === 0) {
    <div class="empty-state">{{ 'reports.noEmployees' | translate }}</div>
  } @else {
    <ag-grid-angular
      style="height: 65vh; min-height: 320px;"
      [theme]="theme"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      [rowData]="rows()"
      [enableRtl]="language.direction() === 'rtl'"
      (gridReady)="onGridReady($event)"
    />
  }
</div>
