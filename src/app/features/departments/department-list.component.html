<div class="card-header">
  <h2>{{ 'departments.title' | translate }}</h2>
  <button type="button" class="btn btn-primary" (click)="openCreate()">{{ 'departments.new' | translate }}</button>
</div>

<div class="card">
  @if (loading()) {
    <div class="loading-row">{{ 'common.loading' | translate }}</div>
  } @else if (items().length === 0) {
    <div class="empty-state">{{ 'departments.empty' | translate }}</div>
  } @else {
    <ag-grid-angular
      [theme]="theme"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      [rowData]="items()"
      [enableRtl]="language.direction() === 'rtl'"
      domLayout="autoHeight"
      (gridReady)="onGridReady($event)"
    />

    <app-pagination
      [pageNumber]="pageNumber()"
      [totalPages]="totalPages()"
      [totalCount]="totalCount()"
      [hasPreviousPage]="hasPreviousPage()"
      [hasNextPage]="hasNextPage()"
      (pageChange)="goToPage($event)"
    />
  }
</div>

@if (dialogOpen()) {
  <div class="dialog-backdrop">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3>{{ (editingId() ? 'departments.editTitle' : 'departments.newTitle') | translate }}</h3>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="form-field">
          <label for="name">{{ 'common.name' | translate }}</label>
          <input id="name" type="text" formControlName="name" />
        </div>
        <div class="form-field">
          <label for="incentivePercent">{{ 'departments.incentivePercent' | translate }}</label>
          <input id="incentivePercent" type="number" step="0.01" formControlName="incentivePercent" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" (click)="closeDialog()">{{ 'common.cancel' | translate }}</button>
          <button type="submit" class="btn btn-primary" [disabled]="saving()">
            {{ (saving() ? 'common.saving' : 'common.save') | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
