<h2>{{ 'settings.salaries.title' | translate }}</h2>
<p style="color: var(--color-text-muted);">{{ 'settings.salaries.hint' | translate }}</p>

<div class="card">
  @if (loading()) {
    <div class="loading-row">{{ 'common.loading' | translate }}</div>
  } @else {
    <ag-grid-angular
      [theme]="theme"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      [rowData]="grades()"
      [enableRtl]="language.direction() === 'rtl'"
      domLayout="autoHeight"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)"
    />
  }
</div>
