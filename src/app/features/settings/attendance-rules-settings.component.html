<div class="card-header">
  <h2>{{ 'settings.rules.title' | translate }}</h2>
  <button type="button" class="btn btn-primary" (click)="openCreate()">{{ 'settings.rules.new' | translate }}</button>
</div>

<div class="card">
  @if (loading()) {
    <div class="loading-row">{{ 'common.loading' | translate }}</div>
  } @else if (rules().length === 0) {
    <div class="empty-state">{{ 'settings.rules.empty' | translate }}</div>
  } @else {
    <ag-grid-angular
      [theme]="theme"
      [columnDefs]="colDefs()"
      [defaultColDef]="defaultColDef"
      [rowData]="rules()"
      [enableRtl]="language.direction() === 'rtl'"
      domLayout="autoHeight"
      (gridReady)="onGridReady($event)"
    />
  }
</div>

@if (dialogOpen()) {
  <div class="dialog-backdrop">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3>{{ (editingId() ? 'settings.rules.editTitle' : 'settings.rules.newTitle') | translate }}</h3>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="form-field">
          <label for="fromDays">{{ 'settings.rules.fromDays' | translate }}</label>
          <input id="fromDays" type="number" formControlName="fromDays" />
        </div>
        <div class="form-field">
          <label for="toDays">{{ 'settings.rules.toDaysHint' | translate }}</label>
          <input id="toDays" type="number" formControlName="toDays" />
        </div>
        <div class="form-field">
          <label for="adjustmentType">{{ 'common.type' | translate }}</label>
          <select id="adjustmentType" formControlName="adjustmentType">
            <option [ngValue]="AttendanceAdjustmentType.Bonus">{{ 'common.bonus' | translate }}</option>
            <option [ngValue]="AttendanceAdjustmentType.Deduction">{{ 'common.deduction' | translate }}</option>
          </select>
        </div>
        <div class="form-field">
          <label for="percent">{{ 'common.percent' | translate }}</label>
          <input id="percent" type="number" step="0.01" formControlName="percent" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" (click)="closeDialog()">{{ 'common.cancel' | translate }}</button>
          <button type="submit" class="btn btn-primary" [disabled]="saving()">
            {{ (saving() ? 'common.saving' : 'common.save') | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
